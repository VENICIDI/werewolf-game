server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: werewolf-backend
  
  datasource:
    # 微信云托管预置了 MYSQL_ADDRESS=host:port 格式；本地开发仍可用 MYSQL_HOST+MYSQL_PORT 分开注入
    url: jdbc:mysql://${MYSQL_ADDRESS:${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}}/${MYSQL_DATABASE:werewolf}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:werewolf}
    password: ${MYSQL_PASSWORD:werewolf123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  
  # 文件上传（头像）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT配置
jwt:
  secret: ${JWT_SECRET:werewolf-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# 微信配置
wechat:
  appid: ${WECHAT_APPID:wxb0e543c0df784e35}  # 微信小程序 AppID
  secret: ${WECHAT_SECRET:c3abbc8261dd6f3435ad45e4afcf5b38}  # 微信小程序 AppSecret

# TTS 配置 — 2026-05-24 从 Fish Audio 迁移到 SiliconFlow CosyVoice2
#   原因：国内服务器无法直连 api.fish.audio（连接超时）
#   API 格式兼容 OpenAI Audio Speech
tts:
  api-key: ${TTS_API_KEY:${SILICONFLOW_API_KEY:sk-whyjuwbwynlkfcjjebdxdaosuimrumsejeaedlezkdazfexj}}
  api-url: ${TTS_API_URL:https://api.siliconflow.cn/v1/audio/speech}
  model: ${TTS_MODEL:FunAudioLLM/CosyVoice2-0.5B}
  voice: ${TTS_VOICE:FunAudioLLM/CosyVoice2-0.5B:alex}

# ASR 配置 — 2026-05-24 从 Fish Audio 迁移到 SiliconFlow SenseVoiceSmall
#   原因：国内服务器无法直连 api.fish.audio（连接超时）
#   API 格式兼容 OpenAI Audio Transcriptions
stt:
  api-key: ${STT_API_KEY:${SILICONFLOW_API_KEY:sk-whyjuwbwynlkfcjjebdxdaosuimrumsejeaedlezkdazfexj}}
  api-url: ${STT_API_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
  model: ${STT_MODEL:FunAudioLLM/SenseVoiceSmall}

# 日志（详细配置见 logback-spring.xml）
logging:
  config: classpath:logback-spring.xml
