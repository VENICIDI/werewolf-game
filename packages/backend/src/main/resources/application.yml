server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: werewolf-backend
  
  datasource:
    # 微信云托管预置了 MYSQL_ADDRESS=host:port 格式；本地开发仍可用 MYSQL_HOST+MYSQL_PORT 分开注入
    url: jdbc:mysql://${MYSQL_ADDRESS:${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}}/${MYSQL_DATABASE:werewolf}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:werewolf}
    password: ${MYSQL_PASSWORD:werewolf123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  
  # 文件上传（头像）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT配置
jwt:
  secret: ${JWT_SECRET:werewolf-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# 微信配置
wechat:
  appid: ${WECHAT_APPID:wxb0e543c0df784e35}  # 微信小程序 AppID
  secret: ${WECHAT_SECRET:c3abbc8261dd6f3435ad45e4afcf5b38}  # 微信小程序 AppSecret

# Fish Audio TTS + ASR 配置（替代原 ai-speech edge-tts + whisper 服务）
fish-audio:
  api-key: ${FISH_AUDIO_API_KEY:fe6fc826f6de4bd2887989eb6c383f7c}
  api-url: ${FISH_AUDIO_API_URL:https://api.fish.audio/v1/tts}
  asr-url: ${FISH_AUDIO_ASR_URL:https://api.fish.audio/v1/asr}
  model: ${FISH_AUDIO_MODEL:s2-pro}
  reference-id: ${FISH_AUDIO_REFERENCE_ID:}  # 留空使用默认音色

# 日志（详细配置见 logback-spring.xml）
logging:
  config: classpath:logback-spring.xml
