server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: werewolf-backend
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:werewolf}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:werewolf}
    password: ${MYSQL_PASSWORD:werewolf123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 6000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  
  # 文件上传（头像）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT配置
jwt:
  secret: ${JWT_SECRET:werewolf-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# 微信配置
wechat:
  appid: ${WECHAT_APPID:wxb0e543c0df784e35}  # 微信小程序 AppID
  secret: ${WECHAT_SECRET:c3abbc8261dd6f3435ad45e4afcf5b38}  # 微信小程序 AppSecret

# 日志（详细配置见 logback-spring.xml）
logging:
  config: classpath:logback-spring.xml
