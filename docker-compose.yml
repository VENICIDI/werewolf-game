version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: werewolf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: werewolf
      MYSQL_USER: werewolf
      MYSQL_PASSWORD: werewolf123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: werewolf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 可选：向量数据库用于 RAG
  chroma:
    image: chromadb/chroma:latest
    container_name: werewolf-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  mysql-data:
  redis-data:
  chroma-data:
